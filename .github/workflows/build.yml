name: Build, Scan, Push

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Build image
        run: docker build -t ghcr.io/rushi-debug/demo-cicd-app:${{ steps.version.outputs.VERSION }} .

      - name: Security scan (Trivy - stand-in for Cycode)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/rushi-debug/demo-cicd-app:${{ steps.version.outputs.VERSION }}
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        run: docker push ghcr.io/rushi-debug/demo-cicd-app:${{ steps.version.outputs.VERSION }}
